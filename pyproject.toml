[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coherence-spacetime-lattice"
version = "0.3.0"
description = "Reaction–diffusion coherence spacetime research framework"
authors = [{name="QuantumQuantara"}]
requires-python = ">=3.9"

dependencies = [
    "numpy>=1.22",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["coherence_spacetime_lattice*"]
